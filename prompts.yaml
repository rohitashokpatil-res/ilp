    If the ambiguity asks only whether two effects are mutually exclusive,
    use mark_values_mutually_exclusive.

    If it asks only whether they belong to one domain, do not silently add
    closure, exclusivity, or single-valuedness.

    If several properties require independent decisions, generate separate
    questions unless M2 assigns the same decision_group_id.

