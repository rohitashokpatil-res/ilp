    The two-second threshold remains requirement-specific.

    M-Context may still extract:

    - login response;
    - response time;
    - and seconds.

    ================================================================
    24. UNRESOLVED RELATIONSHIPS
    ================================================================

    Record a suspected but unconfirmed relationship only when concrete
    document evidence makes the question relevant.

    Unresolved relationship record:

