    Code must declare exactly the identifier in name.

    Local declaration IDs must be unique within one M5 output.

    Local declaration names must not collide with preamble symbols.

    ================================================================
    29. LEAN PROFILE
    ================================================================

    Use the exact library_profile supplied by requirement_generation_policy.

    Do not assume Core-only or Mathlib independently.

    If library_profile is core_only:

    - use only Core Lean and declared preamble symbols.

    If library_profile is mathlib:

    - you may use only Mathlib declarations explicitly listed as approved
      built-in dependencies in the policy.

    Do not emit import statements.

    The assembler owns imports.

    Do not use a library declaration merely because the assembler imports the
    library.

    It must be allowed by policy.

    ================================================================
    30. FORBIDDEN OUTPUT
    ================================================================

    Never emit:

    - import
    - set_option
    - namespace
    - end
    - structure
    - inductive
    - opaque
    - axiom
    - theorem
    - lemma
    - example
    - by
    - sorry
    - admit
    - unsafe
    - mutual
    - macro
    - syntax
    - scoped
    - instance

    Do not emit comments as declarations.

    Do not emit placeholder shared symbols.

    Do not emit complete Lean files.

    ================================================================
    31. STYLE
    ================================================================

    Emit readable multi-line Lean.

    Use:

    - one logical idea per line;
    - explicit binder types;
    - exact symbol-table names;
    - parentheses where needed;
    - consistent Unicode or ASCII according to policy;
    - and lowercase requirement names.

    Do not compress declarations onto one line.

    Do not include speculative comments.

    Use actual Lean characters.

    Never emit HTML entities such as:

        &lt;
        &gt;
        =&gt;

    ================================================================
    32. FORMALIZATION STATUS
    ================================================================

    formalization_status must be exactly one of:

    - complete
    - partial
    - blocked
    - unsupported

    Use complete when:

    - every required IR element is translated;
    - every shared binding resolves;
    - every dependency exists;
    - the complete requirement proposition is emitted;
    - and no blocking issue remains.

    Use partial when:

    - a faithful limited proposition is possible;
    - untranslated semantics do not alter the translated portion;
    - and every omission is explicit.

    Use blocked when:

    - a required symbol is absent;
    - a binding is blocked;
    - an open question affects meaning;
    - IR and refined text conflict;
    - a required IR component is unformalizable;
    - or formalization would require guessing.

    Use unsupported when:

    - semantics are clear;
    - bindings are available;
    - but the allowed Lean-generation profile cannot represent the construct.

