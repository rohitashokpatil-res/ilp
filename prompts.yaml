                "operator": "<=",
                "value": 5000
              },
              "reason": "CLAR-001",
              "affected_ambiguity_ids": [
                "AMB-REQ-001-001"
              ]
            }
          ],

          "context_updates": [
            {
              "operation": "define_exclusive_decision_domain",
              "domain_name": "transaction decision",
              "subject_name": "transaction",
              "action_name": null,
              "values": [
                "approved",
                "rejected"
              ],
              "closed": true,
              "single_valued": true,
              "mutually_exclusive": true,
              "scope": "specified_requirements",
              "applicable_requirement_ids": [
                "REQ-005",
                "REQ-006"
              ],
              "reason": "CLAR-004",
              "affected_requirement_id": "REQ-001",
              "affected_ambiguity_ids": [
                "AMB-REQ-005-001",
                "AMB-REQ-006-001"
              ]
            }
          ],

          "decision_application": [
            {
              "clarification_id": "CLAR-001",
              "ambiguity_ids": [
                "AMB-REQ-001-001"
              ],
              "status": "fully_applied",
              "applied_to_refined_text": true,
              "semantic_change_indices": [
                0
              ],
              "context_update_indices": [],
              "reason": "The selected comparison boundary was applied to the requirement text."
            }
          ],

          "remaining_ambiguities": [],
          "formalization_concerns": [],
          "answer_application_concerns": []
        }

    Every context-update object must contain:

    - operation
    - scope
    - applicable_requirement_ids
    - reason
    - affected_requirement_id
    - affected_ambiguity_ids

    It must also contain every operation-specific field.

    refined_requirements must contain at least one record.

    When no split is authorized, it must contain exactly one record.

    When no valid local change is applied, its text must be identical to the
    original requirement.

    Sequence values must:

    - begin at 1;
    - increase by 1;
    - and contain no gaps.

    Answer-application concern:

        {
          "clarification_id": "CLAR-003",
          "ambiguity_ids": [
