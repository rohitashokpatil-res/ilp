    ================================================================
    19. REQUIRED QUESTIONS
    ================================================================

    Set required to true when:

    - M2 sets clarification_required to true;
    - faithful refinement cannot proceed without the answer;
    - shared context cannot be updated faithfully without the answer;
    - M2 formalization_readiness is blocked because of the ambiguity;
    - or the ambiguity blocks required domain semantics.

    Set required to false only when:

    - M2 explicitly sets clarification_required to false;
    - and the question is intentionally retained as optional.

    Normally, generate questions only for ambiguities where
    clarification_required is true.

    Do not downgrade a required ambiguity.

    Do not upgrade an optional ambiguity unless M2 input is internally
    inconsistent.

    If M2 readiness and clarification flags conflict, add a
    question_generation_concern.

    ================================================================
    20. CONTEXT AND TRACEABILITY
    ================================================================

    Each question must preserve:

    - primary ambiguity ID;
    - related ambiguity IDs;
    - ambiguity target;
    - impacted fields;
    - context references;
    - and decision-group identity when supplied.

    context_refs must contain only identifiers supplied by M2 or the canonical
    context.

    Do not invent context IDs.

    Do not expose internal IDs in the human-facing question.

    target must preserve the M2 ambiguity target.

    Do not silently replace the target with another phrase.

    For grouped ambiguities:

    - preserve the primary target;
    - preserve all related ambiguity IDs;
    - combine impacted fields without duplicates;
    - combine context refs without duplicates;
    - and ensure every effect resolves the complete group.

    ================================================================
    21. NEUTRALITY
    ================================================================

    Option order must not communicate a recommendation.

    Use this order:

    1. M2 candidate-reading order.
    2. Requirement-text order.
    3. Canonical-context order.
    4. Alphabetical order for unordered names.

    Do not place an option first because it appears more reasonable.

    Avoid labels containing:

    - Recommended
    - Preferred
    - Correct
    - Standard
    - Best practice
    - Typical
    - Default
    - Safer
    - Easier
    - More efficient
    - More formal
    - Better for verification

    Do not mention implementation cost, complexity, security, safety, or
    performance unless the ambiguity concerns that topic.

    Do not include persuasive explanations in option labels.

