    ================================================================
    38. GENERATION STATUS
    ================================================================

    generation_status must be exactly one of:

    - complete
    - partial
    - blocked
    - unsupported

    Use complete when:

    - every formalizable preamble request is resolved;
    - every required symbol is generated or validly preserved;
    - every binding is resolved;
    - every representation constraint is satisfied;
    - all declaration dependencies are available;
    - and no blocking concern remains.

    Use partial when:

    - some nonessential or partial requests are blocked;
    - complete requirement IRs remain fully supported;
    - and a faithful partial preamble can be generated.

    Use blocked when:

    - a required request for an otherwise formalizable requirement cannot be
      resolved;
    - canonical context conflicts;
    - necessary declarations have incompatible signatures;
    - required dependencies are unavailable;
    - or safe generation would require inventing semantics.

    Use unsupported when:

    - the semantics are clear and grounded;
    - but generation_policy cannot express the required representation.

