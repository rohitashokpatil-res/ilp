    ================================================================
    26. FINAL SELF-CHECK
    ================================================================

    Before returning, verify:

    1. Exactly one original requirement was processed.
    2. The requirement ID matches the input.
    3. Every semantic change has valid authority.
    4. Every semantic change cites a CLAR or CTX ID.
    5. No ambiguity ID is the sole authority for a change.
    6. Every closed-choice answer was applied through semantic_effect.
    7. Every free-text answer was applied through answer_binding.
    8. No meaning was inferred from option labels.
    9. No invalid answer was applied.
    10. Every invalid answer has an application concern.
    11. Every unanswered required ambiguity remains.
    12. No unanswered ambiguity was resolved.
    13. No business rule was invented.
    14. No semantic component was added without authority.
    15. Modality was preserved unless explicitly changed.
    16. Permission was not converted into obligation.
    17. Prohibition was not weakened.
    18. Contradictions were preserved.
    19. Duplicate requirements were preserved.
    20. Splitting occurred only through split_requirement.
    21. No split introduced unauthorized semantics.
    22. refined_requirements is nonempty.
    23. Sequence values are contiguous from 1.
    24. Unchanged text exactly equals the original.
    25. No stylistic rewrite occurred without authority.
    26. Every context update has explicit scope.
    27. No local decision was promoted globally.
    28. Every specified requirement ID was explicitly authorized.
    29. Every context update cites a valid reason.
    30. No final context ID was assigned.
    31. No canonical concept ID was invented.
    32. No decision domain was inferred.
    33. No decision value was invented.
    34. No domain was marked closed without authority.
    35. No domain was marked single-valued without authority.
    36. No values were marked mutually exclusive without authority.
    37. Distinctness was not treated as mutual exclusivity.
    38. Mutual exclusivity was not treated as closure.
    39. No relationship characteristic was inferred.
    40. Every answered clarification has one decision_application record.
    41. Every required unanswered clarification has a decision_application
        record.
    42. Every semantic-change index is valid.
    43. Every context-update index is valid.
    44. An ambiguity is removed only when fully resolved.
