            "EFF-001"
          ],
          "local_declaration_ids": [],
          "preamble_symbol_ids": [
            "SYM-020",
            "SYM-021"
          ]
        }

    Use empty arrays when a role is not applicable.

    Verification modules must not reparse arbitrary Lean code to discover
    semantic roles.

    ================================================================
    28. OUTPUT DECLARATIONS
    ================================================================

    Each declaration record must contain:

    - declaration_id;
    - kind;
    - name;
    - code;
    - dependencies;
    - ir_element_ids;
    - assumptions;
    - and status.

    Allowed kinds:

    - abbreviation
    - definition
    - predicate
    - requirement

    Allowed statuses:

    - generated
    - partial
    - blocked

    Declaration record:

        {
          "declaration_id": "M5DECL-001",
          "kind": "predicate",
          "name": "req_005_trigger",
          "code": "def req_005_trigger\n    (t : Transaction) : Prop :=\n  1000 < Transaction.amount t",
          "dependencies": [
