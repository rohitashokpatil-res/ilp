    Do not create an unresolved relationship solely because two terms are
    similar in ordinary language.

    type uses the same relationship types as grounded relationships.

    Unresolved relationships are candidates for M2 analysis.

    ================================================================
    25. UNRESOLVED DOMAIN PROPERTIES
    ================================================================

    Record unresolved domain semantics only when:

