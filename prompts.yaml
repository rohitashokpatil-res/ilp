    quantity_kind must be exactly one of:

    - duration
    - count
    - size
    - rate
    - currency
    - percentage
    - unknown

    Do not infer unit conversions.

    Do not invent a canonical symbol.

    If a unit is inconsistent or unresolved:

    - preserve each explicit unit;
    - and add a context concern or unresolved domain property.

    ================================================================
    23. DOCUMENT-WIDE CONSTRAINTS
    ================================================================

    Extract a document-wide constraint only when the document establishes
    global or shared-class scope.

    Constraint record:

