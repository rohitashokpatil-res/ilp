    28. Every reusable semantic effect has explicit scope.
    29. No document-wide scope was inferred.
    30. Every specified requirement ID was supplied by M2 or context.
    31. Requirement-local effects do not claim document-wide scope.
    32. Every free-text question has an empty options array.
    33. Every free-text question has a nonempty answer_binding.
    34. Every free-text question has usable input constraints.
    35. Numeric constraints do not invent bounds.
    36. Every question_type is allowed.
    37. Every answer_format is allowed.
    38. Every context reference exists.
    39. No grounded fact was re-asked.
    40. Unresolved context was not treated as fact.
    41. No decision domain was invented.
    42. No domain value was invented.
    43. No domain was marked closed without asking the relevant question.
    44. No domain was marked single-valued without asking the relevant
        question.
    45. No effects were marked mutually exclusive without asking the relevant
        question.
    46. Distinctness was not treated as exclusivity.
    47. Exclusivity was not treated as closure.
    48. No relationship characteristic was inferred.
    49. Functionality was not treated as totality.
    50. Totality was not treated as functionality.
    51. Symmetry was not inferred from inverse wording.
    52. Every required field is present.
    53. No undeclared top-level or question-level key is present.
    54. clarification_status matches the returned questions and concerns.
    55. questions_generated has at least one question.
    56. no_questions_required has no questions.
    57. blocked has at least one concern.
    58. The output is valid JSON.
    59. No prose appears outside the JSON object.

    ================================================================
    END OF SYSTEM PROMPT
    ================================================================

  user_template: |
    DOCUMENT_ID: {document_id}
    REQUIREMENT_ID: {requirement_id}

    ----- REQUIREMENT -----
    {requirement_text}
    ----- END REQUIREMENT -----

    ----- AMBIGUITIES FOUND BY M2 -----
    {ambiguities}
    ----- END AMBIGUITIES -----

    ----- CANONICAL GLOBAL CONTEXT -----
    {explicit_context}
    ----- END CANONICAL GLOBAL CONTEXT -----

    Generate one neutral clarification question for every independent
    ambiguity where clarification_required is true.

    One requirement may produce zero, one, or multiple questions.

    Combine ambiguities only when:

    - they share the same nonempty decision_group_id;
    - they represent one semantic decision;
    - and one answer completely resolves the decision group.

    Use every supplied ambiguity_id exactly.

    Do not invent, modify, or normalize ambiguity IDs.

    Use M2 candidate readings as options when they form a complete closed set.

    Use free_text when no honest closed alternative set exists.

    Every closed-choice option must contain one concrete semantic_effect.

    Every free-text question must contain one concrete answer_binding and
    usable input_constraints.

    When an answer may create reusable semantic context, explicitly identify
    scope as:

    - requirement;
    - document;
    - or specified_requirements.

    Do not infer document-wide scope.

    Preserve independently decidable semantic properties, including:

    - value-domain closure;
    - decision-domain membership;
    - single-valuedness;
    - multi-valuedness;
    - distinct values;
    - mutually exclusive values;
    - independent effects;
    - relationship functionality;
    - relationship totality;
    - and relationship symmetry.

    Do not combine independent domain properties into one question unless M2
    assigns the same decision_group_id.

    Do not ask the stakeholder to choose a Lean representation.

    Do not answer, rank, recommend, or provide a default.

    Do not re-ask anything already established by grounded canonical context.

    Return only the required JSON object.

