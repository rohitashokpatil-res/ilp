      coverage:
        type: array
        items:
          type: object
      assumptions:
        type: array
        items:
          type: object
      formalization_concerns:
        type: array
        items:
          type: object
      untranslated:
        type: array
        items:
          type: string
modules:
  m1_requirement_extraction:
    input_schema:
      type: object
      additionalProperties: false
      required:
      - document_id
      - document_name
      - line_range
      - chunk_id
      - numbered_document
      properties:
        document_id:
          type: string
        document_name:
          type: string
        line_range:
          type: string
        chunk_id:
          type: string
        numbered_document:
          type: string
    output_schema:
      type: object
      additionalProperties: false
      required:
      - requirements
      properties:
        requirements:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - text
            - start_line
            - end_line
            - source_label
            - requirement_type
            - extraction_basis
            - confidence
            properties:
              text:
                type: string
              start_line:
                $ref: '#/$defs/nullable_line'
              end_line:
                $ref: '#/$defs/nullable_line'
              source_label:
                oneOf:
                - type: string
                - type: 'null'
              requirement_type:
                type: string
                enum:
                - functional
                - performance
                - security
                - availability
                - reliability
                - usability
                - interface
                - data
                - business_rule
                - constraint
                - definition
                - assumption
                - other
              extraction_basis:
                type: string
                enum:
                - explicit_normative_marker
                - normative_declarative_rule
                - explicit_assumption
                - normative_definition
              confidence:
                type: string
                enum:
                - high
                - medium
                - low
    post_schema_validations:
    - exact text and span validation
    - chunk-overlap deduplication
    - requirement ID assignment
  m_context:
    input_schema:
      type: object
      additionalProperties: false
      required:
      - document_id
      - document_name
      - numbered_document
      properties:
        document_id:
          type: string
        document_name:
          type: string
        numbered_document:
          type: string
    output_schema:
      $ref: '#/$defs/global_context'
    post_schema_validations:
    - evidence validation
    - exact deduplication
    - context and canonical ID assignment
  m2_ambiguity:
    input_schema:
      type: object
      additionalProperties: false
      required:
      - document_id
      - requirement_id
      - requirement_text
      - known_context
      - document_context
      properties:
        document_id:
          type: string
        requirement_id:
          type: string
        requirement_text:
          type: string
        known_context:
          $ref: '#/$defs/global_context'
        document_context:
          type: string
    output_schema:
      type: object
      additionalProperties: false
      required:
      - requirement_id
      - is_ambiguous
      - formalization_readiness
      - ambiguities
      properties:
        requirement_id:
          type: string
        is_ambiguous:
          type: boolean
        formalization_readiness:
          type: string
          enum:
          - ready
          - partial
          - blocked
          - unsupported
        ambiguities:
          type: array
          items:
            $ref: '#/$defs/ambiguity'
    post_schema_validations:
    - target and evidence validation
    - context-reference validation
    - ambiguity ID assignment
  m3_clarification:
    input_schema:
      type: object
      additionalProperties: false
      required:
      - document_id
      - requirement_id
      - requirement_text
      - ambiguities
      - explicit_context
      properties:
        document_id:
          type: string
        requirement_id:
          type: string
        requirement_text:
          type: string
        ambiguities:
          type: array
          items:
            $ref: '#/$defs/identified_ambiguity'
        explicit_context:
          $ref: '#/$defs/global_context'
    output_schema:
      type: object
      additionalProperties: false
      required:
      - requirement_id
      - clarification_status
      - clarification_questions
      - question_generation_concerns
      properties:
        requirement_id:
          type: string
        clarification_status:
          type: string
          enum:
          - questions_generated
          - no_questions_required
          - blocked
        clarification_questions:
          type: array
          items:
            $ref: '#/$defs/clarification_question'
        question_generation_concerns:
          type: array
          items:
            type: object
    post_schema_validations:
    - ambiguity coverage
    - decision-group consistency
    - semantic-effect scope validation
    - clarification ID assignment
  m4_refinement:
    input_schema:
      type: object
      additionalProperties: false
      required:
      - document_id
      - requirement_id
      - requirement_text
      - ambiguities
      - clarification_questions
      - clarification_answers
      - explicit_context
      properties:
        document_id:
          type: string
        requirement_id:
          type: string
        requirement_text:
          type: string
        ambiguities:
          type: array
          items:
            $ref: '#/$defs/identified_ambiguity'
        clarification_questions:
          type: array
          items:
            $ref: '#/$defs/clarification_question'
        clarification_answers:
          type: array
          items:
            $ref: '#/$defs/clarification_answer'
        explicit_context:
          $ref: '#/$defs/global_context'
    output_schema:
      type: object
      additionalProperties: false
      required:
      - requirement_id
      - refinement_status
      - refined_requirements
      - semantic_changes
      - context_updates
      - decision_application
      - remaining_ambiguities
      - formalization_concerns
      - answer_application_concerns
      properties:
        requirement_id:
          type: string
        refinement_status:
          type: string
          enum:
          - unchanged
          - refined
          - partially_refined
          - blocked
        refined_requirements:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - sequence
            - text
            properties:
              sequence:
                type: integer
                minimum: 1
              text:
                type: string
        semantic_changes:
          type: array
          items:
            type: object
        context_updates:
          type: array
          items:
            $ref: '#/$defs/semantic_effect'
        decision_application:
          type: array
          items:
            type: object
        remaining_ambiguities:
          type: array
          items:
            $ref: '#/$defs/remaining_ambiguity'
        formalization_concerns:
          type: array
          items:
            type: object
        answer_application_concerns:
          type: array
          items:
            type: object
    post_schema_validations:
    - unchanged-text equality
    - answer authority
    - context-update scope
    - decision-application indices
    - refinement sequence
  m_context_refined:
    input_schema:
      type: object
      additionalProperties: false
      required:
      - document_id
      - numbered_document
      - previous_context
      - refined_requirements
      - validated_decisions
      - context_updates
      - remaining_ambiguities
      properties:
        document_id:
          type: string
        numbered_document:
          type: string
        previous_context:
          $ref: '#/$defs/global_context'
        refined_requirements:
          type: array
          items:
            type: object
        validated_decisions:
          type: array
          items:
            $ref: '#/$defs/clarification_answer'
        context_updates:
          type: array
          items:
            $ref: '#/$defs/semantic_effect'
        remaining_ambiguities:
          type: array
          items:
            $ref: '#/$defs/remaining_ambiguity'
    output_schema:
      type: object
      additionalProperties: false
      required:
      - document_id
      - update_status
      - actors
      - entities
      - roles
      - attributes
      - actions
      - events
      - states
      - value_domains
      - decision_domains
      - distinct_values
      - definitions
      - relationships
      - relationship_characteristics
      - representation_characteristics
      - units
      - constraints
      - unresolved_relationships
      - unresolved_domain_properties
      - context_concerns
      - context_conflicts
      - update_audit
      - update_concerns
      properties:
        document_id:
          type: string
        update_status:
          type: string
          enum:
          - unchanged
          - updated
          - partially_updated
          - blocked
        actors: *id002
        entities: *id003
        roles: *id004
        attributes: *id005
        actions: *id006
        events: *id007
        states: *id008
        value_domains: *id009
        decision_domains: *id010
        distinct_values: *id011
        definitions: *id012
        relationships: *id013
        relationship_characteristics: *id014
        representation_characteristics: *id015
        units: *id016
        constraints: *id017
        unresolved_relationships: *id018
        unresolved_domain_properties: *id019
        context_concerns: *id020
        context_conflicts:
          type: array
          items:
            type: object
        update_audit:
          type: array
          items:
            type: object
        update_concerns:
          type: array
          items:
            type: object
    post_schema_validations:
    - carry-forward completeness
    - update authority
    - evidence validation
    - new context ID assignment
  m_ir:
    input_schema:
      type: object
      additionalProperties: false
      required:
      - document_id
      - requirement_id
      - refinement_id
      - refined_text
      - original_text
      - updated_context
      - clarification_decisions
      - open_issues
      properties:
        document_id:
          type: string
        requirement_id:
          type: string
        refinement_id:
          type: string
        refined_text:
          type: string
        original_text:
          type: string
        updated_context:
          $ref: '#/$defs/global_context'
        clarification_decisions:
          type: array
          items:
            $ref: '#/$defs/clarification_answer'
        open_issues:
          type: array
          items:
            type: object
    output_schema:
      $ref: '#/$defs/m_ir_output'
    post_schema_validations:
    - local-reference validation
    - canonical-reference validation
    - PREQ/RBIND/RCON validation
    - coverage and origin validation
    - IR ID assignment
  m_preamble:
    input_schema:
      type: object
      additionalProperties: false
      required:
      - document_id
      - updated_context
      - requirement_irs
      - refined_requirements
      - generation_policy
      - existing_preamble
      - open_issues
      properties:
        document_id:
          type: string
        updated_context:
          $ref: '#/$defs/global_context'
        requirement_irs:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - ir_id
            - requirement_id
            - ir
            properties:
              ir_id:
                type: string
              requirement_id:
                type: string
              ir:
                $ref: '#/$defs/m_ir_output'
        refined_requirements:
          type: array
          items:
            type: object
        generation_policy:
          type: object
        existing_preamble:
          oneOf:
          - type: object
          - type: 'null'
        open_issues:
          type: array
          items:
            type: object
    output_schema:
      $ref: '#/$defs/m_preamble_output'
    post_schema_validations:
    - request merge and conflict validation
    - symbol/declaration uniqueness
    - dependency DAG
    - forbidden-token scan
    - request and binding coverage
    - preamble compilation
  m5_lean:
    input_schema:
      type: object
      additionalProperties: false
      required:
      - document_id
      - requirement_id
      - ir_id
      - requirement_kind
      - requirement_text
      - refined_requirement_text
      - ir_json
      - preamble_declarations
      - preamble_symbol_table
      - request_resolution
      - binding_resolution
      - requirement_generation_policy
      - open_questions
      properties:
        document_id:
          type: string
        requirement_id:
          type: string
        ir_id:
          type: string
        requirement_kind:
          type: string
        requirement_text:
          type: string
        refined_requirement_text:
          type: string
        ir_json:
          $ref: '#/$defs/m_ir_output'
        preamble_declarations:
          type: array
          items:
            $ref: '#/$defs/preamble_declaration'
        preamble_symbol_table:
          type: object
          additionalProperties: false
          required:
          - symbols
          properties:
            symbols:
              type: array
              items:
                $ref: '#/$defs/preamble_symbol'
        request_resolution:
          type: array
          items:
            $ref: '#/$defs/request_resolution'
        binding_resolution:
          type: array
          items:
            $ref: '#/$defs/binding_resolution'
        requirement_generation_policy:
          type: object
        open_questions:
          type: array
          items:
            type: object
    output_schema:
      $ref: '#/$defs/m5_output'
    post_schema_validations:
    - exact symbol-ID resolution
    - forbidden-token and HTML scan
    - dependency validation
    - coverage validation
    - per-requirement Lean compilation
