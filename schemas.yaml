        - definition
        - predicate
        - requirement
      name:
        type: string
      code:
        type: string
      dependencies:
        type: array
        items:
          $ref: '#/$defs/m5_dependency'
      ir_element_ids:
        type: array
        items:
          type: string
      assumptions:
        type: array
        items:
          type: object
      status:
        type: string
        enum:
        - generated
        - partial
        - blocked
  m5_semantic_role_binding:
    type: object
    additionalProperties: false
    required:
    - ir_element_ids
    - local_declaration_ids
    - preamble_symbol_ids
    properties:
      ir_element_ids:
        type: array
        items:
          type: string
      local_declaration_ids:
        type: array
        items:
          type: string
      preamble_symbol_ids:
        type: array
        items:
          type: string
  m5_semantic_bindings:
    type: object
    additionalProperties: false
    required:
    - trigger
    - precondition
    - effect
    - permission
    - prohibition
    - constraints
    - invariant
    - decision_accessor
    - decision_values
    - actions
    - relationships
    - requirement
    properties:
      trigger:
        $ref: '#/$defs/m5_semantic_role_binding'
      precondition:
        $ref: '#/$defs/m5_semantic_role_binding'
      effect:
        $ref: '#/$defs/m5_semantic_role_binding'
      permission:
        $ref: '#/$defs/m5_semantic_role_binding'
      prohibition:
        $ref: '#/$defs/m5_semantic_role_binding'
      constraints:
        $ref: '#/$defs/m5_semantic_role_binding'
      invariant:
        $ref: '#/$defs/m5_semantic_role_binding'
      decision_accessor:
        $ref: '#/$defs/m5_semantic_role_binding'
      decision_values:
        $ref: '#/$defs/m5_semantic_role_binding'
      actions:
        $ref: '#/$defs/m5_semantic_role_binding'
      relationships:
        $ref: '#/$defs/m5_semantic_role_binding'
      requirement:
        $ref: '#/$defs/m5_semantic_role_binding'
  m5_output:
    type: object
    additionalProperties: false
    required:
    - document_id
    - requirement_id
    - ir_id
    - formalization_status
    - logical_patterns
    - requirement_proposition
    - semantic_bindings
    - declarations
    - coverage
    - assumptions
    - formalization_concerns
    - untranslated
    properties:
      document_id:
        type: string
      requirement_id:
        type: string
