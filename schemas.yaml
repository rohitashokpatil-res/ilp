$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.org/sdlc-pipeline/v2.0
title: SDLC Formal Verification Pipeline Schemas
version: 2.0.0
pipeline_transformations:
  assign_requirement_ids:
    after: m1_requirement_extraction
    before: m2_ambiguity
    format: REQ-{sequence:03d}
  canonicalize_context:
    after: m_context
    before: m2_ambiguity
  assign_ambiguity_ids:
    after: m2_ambiguity
    before: m3_clarification
    format: AMB-{requirement_id}-{sequence:03d}
  assign_clarification_ids:
    after: m3_clarification
    before: m4_refinement
    format: CLAR-{sequence:03d}
  canonicalize_refined_context:
    after: m_context_refined
    before: m_ir
  assign_refinement_ids:
    after: m4_refinement
    before: m_ir
    format: REF-{sequence:03d}
  assign_ir_ids:
    after: m_ir
    before: m_preamble
    format: IR-{sequence:03d}
  assign_preamble_declaration_ids:
    after: m_preamble
    before: m5_lean
    format: PDECL-{sequence:03d}
  assign_preamble_symbol_ids:
    after: m_preamble
    before: m5_lean
    format: SYM-{sequence:03d}
  assign_m5_declaration_ids:
    after: m5_lean
    before: lean_assembly
    format: M5DECL-{sequence:03d}
$defs:
  nullable_line:
    oneOf:
    - type: integer
      minimum: 1
    - type: 'null'
  comparison_operator:
    type: string
    enum:
    - '='
    - '!='
    - <
    - <=
    - '>'
    - '>='
  evidence:
    type: object
    additionalProperties: false
    required:
    - source
    - source_ref
    - quote
    - start_line
    - end_line
    properties:
      source:
        type: string
        enum:
        - original_document
        - requirement
        - context
        - refined_requirement
        - clarification_decision
        - previous_context
      source_ref:
        oneOf:
        - type: string
        - type: 'null'
      quote:
        type: string
        minLength: 1
      start_line:
        $ref: '#/$defs/nullable_line'
      end_line:
        $ref: '#/$defs/nullable_line'
  unresolved_item:
    type: object
    additionalProperties: false
    required:
    - term
    - missing
    properties:
      term:
        type: string
      missing:
        type: string
  cardinality:
    type: object
    additionalProperties: false
    required:
    - expression
    - operator
    - value
    - resolved
    properties:
      expression:
        type: string
      operator:
        oneOf:
        - $ref: '#/$defs/comparison_operator'
        - type: 'null'
      value: {}
      resolved:
        type: boolean
  scope_spec:
    type: object
    additionalProperties: false
    required:
    - scope
    - applicable_requirement_ids
    properties:
      scope:
        type: string
        enum:
        - requirement
        - document
        - specified_requirements
      applicable_requirement_ids:
        type: array
        items:
          type: string
    allOf:
    - if:
        properties:
          scope:
            const: specified_requirements
      then:
        properties:
          applicable_requirement_ids:
            minItems: 1
    - if:
        properties:
          scope:
            const: document
      then:
        properties:
          applicable_requirement_ids:
            maxItems: 0
  typed_operand:
    type: object
    additionalProperties: false
    required:
    - kind
    properties:
      kind:
        type: string
        enum:
        - attribute_ref
        - entity_ref
        - actor_ref
        - action_ref
        - event_ref
        - state_ref
        - relationship_ref
        - condition_ref
        - shared_symbol_request
        - value_domain_member
        - decision_value
        - literal
        - count
        - measure
        - unresolved
      ref:
        type: string
      request_ref:
        type: string
      domain_ref:
        type: string
      value: {}
      value_type:
        type: string
      unit:
        oneOf:
        - type: string
        - type: 'null'
      source_text:
        type: string
    allOf:
    - if:
        properties:
          kind:
            enum:
            - attribute_ref
            - entity_ref
            - actor_ref
            - action_ref
            - event_ref
            - state_ref
            - relationship_ref
            - condition_ref
            - shared_symbol_request
      then:
        required:
        - ref
    - if:
        properties:
          kind:
            const: literal
      then:
        required:
        - value
        - value_type
    - if:
        properties:
          kind:
            const: value_domain_member
      then:
        required:
        - domain_ref
        - value
    - if:
        properties:
          kind:
            const: decision_value
      then:
        required:
        - request_ref
        - value
    - if:
        properties:
          kind:
            const: unresolved
      then:
        required:
        - source_text
  context_actor:
    type: object
    additionalProperties: false
    required:
    - name
    - actor_kind
    - evidence
    properties:
      id:
        oneOf:
        - type: string
        - type: 'null'
      concept_id:
        oneOf:
        - type: string
        - type: 'null'
      context_id:
        oneOf:
        - type: string
        - type: 'null'
      formal_name_candidate:
        oneOf:
        - type: string
        - type: 'null'
      semantic_category:
        type: string
      source_forms:
        type: array
        items:
          type: string
      evidence:
        type: array
        items:
          $ref: '#/$defs/evidence'
        minItems: 1
      name:
        type: string
      actor_kind:
        type: string
        enum:
        - human_role
        - system
        - external_system
        - organization
        - service
        - unknown
