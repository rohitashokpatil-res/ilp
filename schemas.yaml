      request_resolution:
        type: array
        items:
          $ref: '#/$defs/request_resolution'
      binding_resolution:
        type: array
        items:
          $ref: '#/$defs/binding_resolution'
      coverage:
        type: array
        items:
          type: object
      blocked_requests:
        type: array
        items:
          type: object
      blocked_symbols:
        type: array
        items:
          type: object
      request_conflicts:
        type: array
        items:
          type: object
      generation_concerns:
        type: array
        items:
          type: object
      generation_audit:
        type: array
        items:
          type: object
  m5_dependency:
